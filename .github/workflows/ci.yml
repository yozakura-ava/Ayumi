name: Ayumi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install ruff bandit
      - name: Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xf gitleaks_8.21.2_linux_x64.tar.gz
          ./gitleaks detect --source . --config .gitleaks.toml --verbose --report-format json --report-path gitleaks-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ruff lint + format
        run: ruff check src/ tests/ --ignore E501 --statistics || echo "lint advisories present — non-blocking"
        continue-on-error: true
      - name: Bandit security scan
        run: bandit -r src/ -ll --format txt || echo "bandit advisories present — non-blocking"
        continue-on-error: true

  lint-test:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-duckdb.txt
      - name: Run tests
        run: >-
          pytest tests/unit -q --tb=line -p no:cacheprovider --timeout=300
          --ignore=tests/unit/backtest/test_close_path_fidelity.py
          --ignore=tests/unit/core/test_sweep_runner.py
          --ignore=tests/unit/forward_test/test_blend_position_close.py
          --ignore=tests/unit/risk/test_kill_switch_harness_isolation.py
          --ignore=tests/unit/test_blend_position_mapping_live.py
          --ignore=tests/unit/test_blend_runner_caller_contract.py
          --ignore=tests/unit/test_blend_runner_signal_id_contract.py
          --ignore=tests/unit/test_blend_runner_signal_stats_wiring.py
          --ignore=tests/unit/core/test_blend_optimizer.py
