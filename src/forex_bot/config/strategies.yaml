# ── Signal Filters ─────────────────────────────────────────────────────────
# FilterChain configuration: filters run in priority order (ascending).
# First filter to reject a signal stops the chain (short-circuit).
# Set enabled: false to skip a filter entirely.
filters:
  trend:
    enabled: true
    ema_fast_period: 9
    ema_slow_period: 21
    tolerance_pips: 0.0
  atr:
    enabled: true
  fvg:
    enabled: true
  orb:
    enabled: true
    min_score_threshold: 0.3
    breakout_min_fraction: 0.10

forward_test:
  account_balance: 100000  # Phase 0: FTMO 1-Step canonical ($100K)
  spread_pips:
    GBPUSD: 2.0
    EURUSD: 2.0
    USDJPY: 2.0
    XAUUSD: 40.0
    AUDUSD: 2.0
    USDCHF: 2.0
    USDCAD: 2.0
  ftmo:
    # Phase 0: FTMO 1-Step canonical values (3% daily / 10% total / $100K)
    # Source of truth: risk/ftmo_guard.py FTMOGuard defaults
    daily_loss_limit_pct: 0.03
    total_drawdown_limit_pct: 0.10
    max_positions: 3
    max_trades_per_day: 10
    min_risk_reward: 0.0
    # Best-day rule enforcement: halt trading when one day's profit
    # exceeds this fraction of total positive-days profit.
    # Default 40% provides a 10% safety buffer below the FTMO 50% hard cap.
    best_day_enforce_pct: 0.40

  strategies:
    # ── SRMR+ Optimized Params (Optuna+WF validated 2026-07-08) ──
