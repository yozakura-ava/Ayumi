[pytest]
testpaths = tests
pythonpath = src/forex_bot src tests scripts
timeout = 30
addopts = -m "not live"
markers =
    live: marks tests that require live broker connection (deselect with '-m "not live"')
# Redirect pytest's own log capture to /tmp so it never touches production logs.
# Application-level logging is auto-redirected by logging_config.py when it
# detects pytest in sys.modules (see common/logging_config.py).
log_file = /tmp/ayumi_pytest.log
log_file_level = WARNING
# Exclude archived code and worktrees from test discovery — they shadow the
# active source tree and cause import errors (e.g., _archive has older signal_engine
# without signal_stats.py, worktrees have parallel test sets).
norecursedirs = _archive worktrees *.egg-info dist build .venv

[memray]
# Memory profiling for test runs (BQ-1038)
# Run with: pytest --memray tests/
limit_memory = 2GB

